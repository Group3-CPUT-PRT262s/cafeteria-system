<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{base :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/staff.css}">
    <title th:text="${pageTitle}">Settings</title>
</head>
<body>
<th:block th:replace="~{base :: layout(~{::content})}">
    <th:block th:fragment="content">
        <section class="staff-page settings-page">
            <header class="staff-page-header">
                <div>
                    <span class="staff-eyebrow">System configuration</span>
                    <h1>System Settings</h1>
                    <p>Manage categories, pickup time slots, and user accounts.</p>
                </div>
            </header>

            <div class="settings-grid">
            <!-- ── Categories ───────────────── -->
            <div class="settings-card">
                <div class="settings-card-title">
                    <i class="bi bi-tags"></i>
                    Menu Categories
                </div>

                <ul class="settings-list"
                    id="categoriesList">
                    <li th:each="cat : ${categories}">
                        <div>
                            <div class="item-name"
                                 th:text="${cat.categoryName}">
                            </div>
                            <div class="item-meta"
                                 th:text="|ID: ${cat.categoryId}|">
                            </div>
                        </div>
                        <button class="btn-icon"
                                type="button"
                                th:data-category-action-id="${cat.categoryId}"
                                th:data-category-id="${cat.categoryId}"
                                th:data-category-name="${cat.categoryName}">
                            <i class="bi bi-pencil-square"></i>
                            Edit
                        </button>
                        <button class="btn-icon btn-icon-danger" type="button"
                                th:data-delete-category-id="${cat.categoryId}"
                                th:data-category-name="${cat.categoryName}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </li>
                </ul>

                <div class="add-form">
                    <input type="text"
                           id="newCategoryName"
                           placeholder="Category name">
                    <button class="btn-add"
                            onclick="addCategory()">
                        <i class="bi bi-plus-lg me-1"></i>Add
                    </button>
                </div>
            </div>

            <!-- ── Time Slots ────────────────── -->
            <div class="settings-card">
                <div class="settings-card-title">
                    <i class="bi bi-clock"></i>
                    Pickup Time Slots
                </div>

                <ul class="settings-list"
                    id="slotsList">
                    <li th:each="slot : ${timeSlots}">
                        <div>
                            <div class="item-name"
                                 th:text="${slot.slotTime}">
                            </div>
                            <div class="item-meta"
                                 th:text="'Max orders: '
                                 + ${slot.maxOrders}">
                            </div>
                        </div>
                        <div class="d-flex align-items-center
                                gap-2">
                            <button class="btn-icon" type="button"
                                    th:data-edit-slot-id="${slot.timeSlotId}"
                                    th:data-slot-time="${slot.slotTime}"
                                    th:data-max-orders="${slot.maxOrders}">
                                <i class="bi bi-pencil-square"></i> Edit
                            </button>
                            <button class="btn-icon-toggle"
                                    type="button"
                                    th:data-toggle-slot-id="${slot.timeSlotId}"
                                    th:classappend="${!slot.isActive}
                                    ? ' inactive' : ''"
                                    th:text="${slot.isActive}
                                    ? 'Active' : 'Inactive'"
                                    >
                            </button>
                            <button class="btn-icon
                                       btn-icon-danger"
                                    type="button"
                                    th:data-delete-slot-id="${slot.timeSlotId}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </li>
                </ul>

                <div class="add-form">
                    <input type="time"
                           id="newSlotTime"
                           placeholder="12:00">
                    <input type="number"
                           id="newSlotMax"
                           placeholder="Max orders"
                           value="20"
                           min="1"
                           style="max-width:110px">
                    <button class="btn-add"
                            onclick="addSlot()">
                        <i class="bi bi-plus-lg me-1"></i>Add
                    </button>
                </div>
            </div>

            <!-- ── Users ─────────────────────── -->
            <div class="settings-card settings-user-management"
                 style="grid-column: 1 / -1">
                <div class="settings-card-title">
                    <i class="bi bi-people"></i>
                    User Management
                </div>

                <div class="settings-user-filters">
                    <label class="settings-user-search">
                        <i class="bi bi-search" aria-hidden="true"></i>
                        <span class="visually-hidden">Search users</span>
                        <input id="userSearch" type="search"
                               placeholder="Search name, username, email or ID">
                    </label>
                    <select id="userRoleFilter" class="settings-field">
                        <option value="">All roles</option>
                        <option value="STUDENT">Student</option>
                        <option value="STAFF">Staff</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                    <select id="userStatusFilter" class="settings-field">
                        <option value="">All account statuses</option>
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                        <option value="SUSPENDED">Suspended</option>
                    </select>
                    <span id="userCount" class="item-meta"></span>
                </div>

                <div class="settings-user-table-wrap">
                <table class="table settings-user-table">
                    <thead>
                    <tr>
                        <th>ID</th><th>User</th><th>Username</th><th>Email</th>
                        <th>Role</th><th>Account status</th><th>Registered</th>
                    </tr>
                    </thead>
                    <tbody id="usersList">
                    <tr th:each="user : ${users}"
                        th:data-user-id="${user.userId}"
                        th:data-user-name="${user.displayName}"
                        th:data-user-username="${user.username}"
                        th:data-user-email="${user.email}"
                        th:data-user-role="${user.role}"
                        th:data-user-status="${user.accountStatus}">
                        <td th:text="${user.userId}"></td>
                        <td th:text="${user.displayName}"></td>
                        <td th:text="${user.username}"></td>
                        <td th:text="${user.email}"></td>
                        <td><select class="settings-role-select user-role"
                                    th:attr="data-user-id=${user.userId}">
                                <option value="STUDENT"
                                        th:selected="${user.role
                                        == 'STUDENT'}">
                                    STUDENT
                                </option>
                                <option value="STAFF"
                                        th:selected="${user.role
                                        == 'STAFF'}">
                                    STAFF
                                </option>
                                <option value="ADMIN"
                                        th:selected="${user.role
                                        == 'ADMIN'}">
                                    ADMIN
                                </option>
                            </select></td>
                        <td><select class="settings-role-select user-status"
                                    th:attr="data-user-id=${user.userId}">
                                <option value="ACTIVE" th:selected="${user.accountStatus == 'ACTIVE'}">ACTIVE</option>
                                <option value="INACTIVE" th:selected="${user.accountStatus == 'INACTIVE'}">INACTIVE</option>
                                <option value="SUSPENDED" th:selected="${user.accountStatus == 'SUSPENDED'}">SUSPENDED</option>
                            </select></td>
                        <td th:text="${user.createdAt == null ? '—' : #temporals.format(user.createdAt, 'dd MMM yyyy')}"></td>
                    </tr>
                    </tbody>
                </table>
                <p id="noUsersMatch" class="item-meta d-none">No users match these filters.</p>
                </div>

                <!-- Create new staff/admin account -->
                <div class="settings-card-title mt-3"
                     style="font-size:0.875rem">
                    <i class="bi bi-person-plus"></i>
                    Create Staff or Admin Account
                </div>
                <div class="settings-user-form">
                        <input type="text"
                               class="settings-field"
                               id="newUsername"
                               placeholder="Username"
                               autocomplete="username">
                        <input type="password"
                               class="settings-field"
                               id="newPassword"
                               placeholder="Password"
                               autocomplete="new-password">
                        <input type="text"
                               class="settings-field"
                               id="newFirstName"
                               placeholder="First name"
                               autocomplete="given-name">
                        <input type="text"
                               class="settings-field"
                               id="newLastName"
                               placeholder="Last name"
                               autocomplete="family-name">
                        <input type="email"
                               class="settings-field"
                               id="newEmail"
                               placeholder="Email"
                               autocomplete="email">
                        <select class="settings-field"
                                id="newRole"
                                aria-label="New account role">
                            <option value="STAFF">STAFF</option>
                            <option value="ADMIN">ADMIN</option>
                        </select>
                        <button class="btn-add"
                                onclick="createUser()">
                            Create account
                        </button>
                </div>
            </div>
            </div>

    <!-- Toast -->
    <div class="toast-container position-fixed
            bottom-0 end-0 p-3">
        <div id="settingsToast"
             class="toast align-items-center border-0"
             role="alert">
            <div class="d-flex">
                <div class="toast-body"
                     id="settingsToastMsg"></div>
                <button type="button"
                        class="btn-close btn-close-white
                           me-2 m-auto"
                        data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

    async function adminRequest(url, method, body) {
        const headers = {};
        if (body !== undefined) headers['Content-Type'] = 'application/json';
        if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
        const response = await fetch(url, {
            method,
            credentials: 'same-origin',
            headers,
            ...(body === undefined ? {} : { body: JSON.stringify(body) })
        });
        const data = await response.json();
        if (!response.ok || data.status === 'error') {
            throw new Error(data.message || 'The operation could not be completed.');
        }
        return data;
    }

    function runAdminAction(action) {
        action().catch(error => showToast(error.message, true));
    }

    async function addCategory() {
        const categoryName = document.getElementById('newCategoryName').value.trim();
        if (!categoryName) return showToast('Enter a category name.', true);
        const result = await adminRequest('/api/staff/categories', 'POST', { categoryName });
        showToast(result.message);
        location.reload();
    }

    async function editCategory(id, name) {
        const categoryName = prompt('Update category name:', name)?.trim();
        if (!categoryName || categoryName === name) return;
        const result = await adminRequest(`/api/staff/categories/${id}`, 'PUT', { categoryName });
        showToast(result.message);
        location.reload();
    }

    async function deleteCategory(id, name) {
        if (!confirm(`Delete category "${name}"? Categories containing menu items cannot be deleted.`)) return;
        const result = await adminRequest(`/api/staff/categories/${id}`, 'DELETE');
        showToast(result.message);
        location.reload();
    }

    async function addSlot() {
        const slotTime = document.getElementById('newSlotTime').value;
        const maxOrders = Number.parseInt(document.getElementById('newSlotMax').value, 10);
        if (!slotTime || !Number.isInteger(maxOrders) || maxOrders < 1) {
            return showToast('Enter a collection time and a positive maximum order count.', true);
        }
        const result = await adminRequest('/api/staff/time-slots', 'POST', { slotTime, maxOrders });
        showToast(result.message);
        location.reload();
    }

    async function editSlot(id, originalTime, originalMax) {
        const slotTime = prompt('Collection time (24-hour HH:mm):', originalTime)?.trim();
        if (!slotTime) return;
        const maxInput = prompt('Maximum orders for this slot:', originalMax);
        if (maxInput === null) return;
        const maxOrders = Number.parseInt(maxInput, 10);
        if (!Number.isInteger(maxOrders) || maxOrders < 1) {
            return showToast('Maximum orders must be a positive whole number.', true);
        }
        const result = await adminRequest(`/api/staff/time-slots/${id}`, 'PUT', { slotTime, maxOrders });
        showToast(result.message);
        location.reload();
    }

    async function toggleSlot(id, button) {
        const result = await adminRequest(`/api/staff/time-slots/${id}/toggle`, 'PATCH');
        button.textContent = result.isActive ? 'Active' : 'Inactive';
        button.classList.toggle('inactive', !result.isActive);
        showToast(result.message);
    }

    async function deleteSlot(id) {
        if (!confirm('Delete this collection time slot? Slots with orders must be deactivated instead.')) return;
        const result = await adminRequest(`/api/staff/time-slots/${id}`, 'DELETE');
        showToast(result.message);
        location.reload();
    }

    async function updateRole(userId, role, select) {
        const oldRole = select.dataset.currentValue;
        try {
            const result = await adminRequest(`/api/staff/users/${userId}/role`, 'PATCH', { role });
            select.dataset.currentValue = role;
            showToast(result.message);
            location.reload();
        } catch (error) {
            select.value = oldRole;
            showToast(error.message, true);
        }
    }

    async function updateAccountStatus(userId, accountStatus, select) {
        const oldStatus = select.dataset.currentValue;
        try {
            const result = await adminRequest(`/api/staff/users/${userId}/status`, 'PATCH', { accountStatus });
            select.dataset.currentValue = accountStatus;
            showToast(result.message);
            location.reload();
        } catch (error) {
            select.value = oldStatus;
            showToast(error.message, true);
        }
    }

    function createUser() {
        const username  = document.getElementById(
            'newUsername').value.trim();
        const password  = document.getElementById(
            'newPassword').value;
        const firstName = document.getElementById(
            'newFirstName').value.trim();
        const lastName  = document.getElementById(
            'newLastName').value.trim();
        const email     = document.getElementById(
            'newEmail').value.trim();
        const role      = document.getElementById(
            'newRole').value;

        if (!username || !password || !email) {
            showToast(
                'Username, password and email are required.',
                true);
            return;
        }

        runAdminAction(async () => {
            const result = await adminRequest('/api/staff/users', 'POST', {
                username, password, firstName, lastName, email, role
            });
            showToast(result.message);
            location.reload();
        });
    }

    function showToast(message, isError = false) {
        const toast = document.getElementById('settingsToast');
        document.getElementById('settingsToastMsg')
            .textContent = message;
        toast.style.background = isError
            ? '#c0392b' : '#2A2B2A';
        new bootstrap.Toast(toast, { delay: 3000 }).show();
    }

    document.getElementById('categoriesList').addEventListener('click', event => {
        const editButton = event.target.closest('[data-category-action-id]');
        const deleteButton = event.target.closest('[data-delete-category-id]');
        if (editButton) runAdminAction(() =>
            editCategory(Number(editButton.dataset.categoryActionId), editButton.dataset.categoryName));
        if (deleteButton) runAdminAction(() =>
            deleteCategory(Number(deleteButton.dataset.deleteCategoryId), deleteButton.dataset.categoryName));
    });

    document.getElementById('slotsList').addEventListener('click', event => {
        const editButton = event.target.closest('[data-edit-slot-id]');
        const toggleButton = event.target.closest('[data-toggle-slot-id]');
        const deleteButton = event.target.closest('[data-delete-slot-id]');
        if (editButton) runAdminAction(() => editSlot(
            Number(editButton.dataset.editSlotId),
            editButton.dataset.slotTime,
            Number(editButton.dataset.maxOrders)));
        if (toggleButton) runAdminAction(() =>
            toggleSlot(Number(toggleButton.dataset.toggleSlotId), toggleButton));
        if (deleteButton) runAdminAction(() =>
            deleteSlot(Number(deleteButton.dataset.deleteSlotId)));
    });

    function filterUsers() {
        const query = document.getElementById('userSearch').value.trim().toLowerCase();
        const role = document.getElementById('userRoleFilter').value;
        const status = document.getElementById('userStatusFilter').value;
        let visible = 0;
        document.querySelectorAll('#usersList tr').forEach(row => {
            const searchableText = [
                row.dataset.userId,
                row.dataset.userName,
                row.dataset.userUsername,
                row.dataset.userEmail
            ].join(' ').toLowerCase();
            const matches = (!query || searchableText.includes(query))
                && (!role || row.dataset.userRole === role)
                && (!status || row.dataset.userStatus === status);
            row.classList.toggle('d-none', !matches);
            if (matches) visible++;
        });
        document.getElementById('userCount').textContent =
            `${visible} of ${document.querySelectorAll('#usersList tr').length} users`;
        document.getElementById('noUsersMatch').classList.toggle('d-none', visible > 0);
    }

    document.getElementById('userSearch').addEventListener('input', filterUsers);
    document.getElementById('userRoleFilter').addEventListener('change', filterUsers);
    document.getElementById('userStatusFilter').addEventListener('change', filterUsers);
    document.querySelectorAll('.user-role').forEach(select => {
        select.dataset.currentValue = select.value;
        select.addEventListener('change', () =>
            updateRole(select.dataset.userId, select.value, select));
    });
    document.querySelectorAll('.user-status').forEach(select => {
        select.dataset.currentValue = select.value;
        select.addEventListener('change', () =>
            updateAccountStatus(select.dataset.userId, select.value, select));
    });
    filterUsers();
</script>
        </section>
</th:block>
</th:block>
</body>
</html>
