<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Menu Management</h2>
            <p class="text-muted">Add, edit, or manage menu items and inventory.</p>
        </div>
        <div>
            <a class="btn btn-primary" href="/staff/edit-item">Add New Item</a>
            <a class="btn btn-secondary" href="/staff/dashboard">Dashboard</a>
            <a class="btn btn-outline-danger" href="/logout">Logout</a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Item Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Status</th>
                <th>Active</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.itemName}"></td>
                <td th:text="${item.description}"></td>
                <td th:text="'₦' + ${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}"></td>
                <td>
                    <span th:text="${item.status}" 
                          th:classappend="${item.status == 'Available' ? 'badge bg-success' : (item.status == 'Low Stock' ? 'badge bg-warning' : 'badge bg-danger')}"></span>
                </td>
                <td>
                    <span th:if="${item.isActive}" class="badge bg-success">Yes</span>
                    <span th:if="!${item.isActive}" class="badge bg-secondary">No</span>
                </td>
                <td th:text="${#temporals.format(item.createdAt, 'dd MMM yyyy')}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/staff/edit-item(id=${item.id})}">Edit</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${items.empty}" class="alert alert-info">
        No menu items found. <a href="/staff/edit-item">Add one now</a>.
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
