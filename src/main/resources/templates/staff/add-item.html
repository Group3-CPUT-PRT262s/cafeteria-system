<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{base :: head}"></th:block>
    <title th:text="${pageTitle}">Add Item</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <style>
        .form-wrapper {
            max-width: 600px;
        }
        .form-card {
            background:    #fff;
            border:        1px solid var(--cc-border);
            border-radius: 16px;
            padding:       2rem;
        }
        .form-card-title {
            font-size:     1.1rem;
            font-weight:   700;
            color:         var(--cc-navy);
            margin-bottom: 1.5rem;
            display:       flex;
            align-items:   center;
            gap:           8px;
        }
        .form-label {
            font-size:   0.82rem;
            font-weight: 600;
            color:       #495057;
        }
        .form-control,
        .form-select {
            border:        1.5px solid var(--cc-border);
            border-radius: 12px;
            background:    #f8fafd;
            font-size:     0.9rem;
        }
        .form-control:focus,
        .form-select:focus {
            border-color: var(--cc-navy);
            box-shadow:   0 0 0 3px rgba(31,56,100,0.1);
            background:   #fff;
        }
        .form-actions {
            display:    flex;
            gap:        1rem;
            margin-top: 1.5rem;
        }
        .btn-save {
            padding:       0.7rem 1.75rem;
            background:    var(--cc-navy);
            color:         #fff;
            border:        none;
            border-radius: 12px;
            font-weight:   600;
            cursor:        pointer;
            transition:    all 0.15s;
        }
        .btn-save:hover   { background: #162d52; }
        .btn-save:disabled {
            background: #aaa;
            cursor:     not-allowed;
        }
        .btn-cancel {
            padding:       0.7rem 1.75rem;
            background:    #fff;
            color:         var(--cc-muted);
            border:        1.5px solid var(--cc-border);
            border-radius: 12px;
            font-weight:   600;
            cursor:        pointer;
            text-decoration: none;
            display:       flex;
            align-items:   center;
            transition:    all 0.15s;
        }
        .btn-cancel:hover {
            border-color: var(--cc-navy);
            color:        var(--cc-navy);
        }
        #formError {
            border-radius: 12px;
            font-size:     0.875rem;
        }
    </style>
</head>
<body>
<th:block th:replace="~{base :: layout(~{::content})}">
    <th:block th:fragment="content">

        <div class="container-fluid px-4">
            <div class="form-wrapper">

                <div class="page-header">
                    <h1>Add New Item</h1>
                    <p>Add a new item to the cafeteria menu</p>
                </div>

                <div class="form-card">
                    <div class="form-card-title">
                        <i class="bi bi-plus-circle"></i>
                        Item Details
                    </div>

                    <div id="formError"
                         class="alert alert-danger"
                         style="display:none"></div>
                    <div id="formSuccess"
                         class="alert alert-success"
                         style="display:none"></div>

                    <div class="mb-3">
                        <label class="form-label">Item Name *</label>
                        <input type="text"
                               class="form-control"
                               id="itemName"
                               placeholder="e.g. Chicken Wrap">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control"
                                  id="description"
                                  rows="3"
                                  placeholder="Brief description of the item">
            </textarea>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Price (R) *</label>
                            <input type="number"
                                   class="form-control"
                                   id="price"
                                   min="0"
                                   step="0.50"
                                   placeholder="0.00">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">Category *</label>
                            <select class="form-select" id="categoryId">
                                <option value="">
                                    Select category...
                                </option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.categoryId}"
                                        th:text="${cat.categoryName}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Initial Status
                        </label>
                        <select class="form-select" id="status">
                            <option value="Available">Available</option>
                            <option value="Low Stock">Low Stock</option>
                            <option value="Sold Out">Sold Out</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button class="btn-save"
                                id="saveBtn"
                                onclick="saveItem()">
                            <i class="bi bi-check-lg me-1"></i>
                            Add Item
                        </button>
                        <a href="/staff/menu" class="btn-cancel">
                            Cancel
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </th:block>
</th:block>

<script>
    // CREATE — add new menu item
    // POST /api/staff/menu
    // DATABASE OPERATION: CREATE
    // Inserts a new row into the menu_items table
    function saveItem() {
        const itemName = document.getElementById('itemName').value.trim();
        const description = document.getElementById('description').value.trim();
        const price = document.getElementById('price').value;
        const categoryId = document.getElementById('categoryId').value;
        const status = document.getElementById('status').value;
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        // Validation
        if (!itemName) {
            showError('Item name is required.');
            return;
        }
        if (!price || Number.parseFloat(price) <= 0) {
            showError('Please enter a valid price.');
            return;
        }
        if (!categoryId) {
            showError('Please select a category.');
            return;
        }

        const btn = document.getElementById('saveBtn');
        btn.disabled    = true;
        btn.textContent = 'Saving...';

        // CREATE — POST inserts into menu_items
        fetch('/api/staff/menu', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },
            body: JSON.stringify({
                itemName: itemName,
                description: description,
                price: Number.parseFloat(price),
                categoryId: Number.parseInt(categoryId),
                status: status
            })
        })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('formError')
                        .style.display = 'none';
                    document.getElementById('formSuccess')
                        .textContent   =
                        `"${data.itemName}" added successfully!`;
                    document.getElementById('formSuccess')
                        .style.display = 'block';
                    // Redirect after short delay
                    setTimeout(() =>
                            window.location.href = '/staff/menu',
                        1200);
                } else {
                    showError(data.message);
                    btn.disabled    = false;
                    btn.textContent = 'Add Item';
                }
            })
            .catch(() => {
                showError('Something went wrong. Please try again.');
                btn.disabled    = false;
                btn.textContent = 'Add Item';
            });
    }

    function showError(message) {
        const el = document.getElementById('formError');
        el.textContent   = message;
        el.style.display = 'block';
        document.getElementById('formSuccess')
            .style.display = 'none';
    }
</script>
</body>
</html>
