<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Menu Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <span th:if="${item == null}">Add New Menu Item</span>
                        <span th:if="${item != null}">Edit Menu Item</span>
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/staff/menu-management}" method="post">
                        <input type="hidden" name="id" th:value="${item?.id}" />

                        <div class="mb-3">
                            <label for="itemName" class="form-label">Item Name *</label>
                            <input type="text" class="form-control" id="itemName" name="itemName" 
                                   th:value="${item?.itemName}" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" 
                                      rows="3" th:text="${item?.description}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="categoryId" class="form-label">Category *</label>
                            <select class="form-select" id="categoryId" name="categoryId" required>
                                <option value="">Select a category</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}"
                                        th:text="${cat.categoryName}"
                                        th:selected="${item?.categoryId == cat.id}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">Price (₦) *</label>
                            <input type="number" class="form-control" id="price" name="price" 
                                   step="0.01" th:value="${item?.price}" required>
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status">
                                <option th:selected="${item?.status == 'Available'}">Available</option>
                                <option th:selected="${item?.status == 'Low Stock'}">Low Stock</option>
                                <option th:selected="${item?.status == 'Sold Out'}">Sold Out</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a class="btn btn-secondary" href="/staff/menu-management">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Item</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
