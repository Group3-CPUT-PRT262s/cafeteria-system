<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{base :: head}"></th:block>
    <title th:text="${pageTitle}">Edit Item</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <style>
        .form-wrapper { max-width: 600px; }
        .form-card {
            background:    #fff;
            border:        1px solid var(--cc-border);
            border-radius: 16px;
            padding:       2rem;
        }
        .form-card-title {
            font-size:     1.1rem;
            font-weight:   700;
            color:         var(--cc-navy);
            margin-bottom: 1.5rem;
            display:       flex;
            align-items:   center;
            gap:           8px;
        }
        .form-label {
            font-size:   0.82rem;
            font-weight: 600;
            color:       #495057;
        }
        .form-control, .form-select {
            border:        1.5px solid var(--cc-border);
            border-radius: 12px;
            background:    #f8fafd;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--cc-navy);
            box-shadow:   0 0 0 3px rgba(31,56,100,0.1);
            background:   #fff;
        }
        .form-actions {
            display:    flex;
            gap:        1rem;
            margin-top: 1.5rem;
        }
        .btn-save {
            padding:       0.7rem 1.75rem;
            background:    var(--cc-navy);
            color:         #fff;
            border:        none;
            border-radius: 12px;
            font-weight:   600;
            cursor:        pointer;
            transition:    all 0.15s;
        }
        .btn-save:hover { background: #162d52; }
        .btn-cancel {
            padding:         0.7rem 1.75rem;
            background:      #fff;
            color:           var(--cc-muted);
            border:          1.5px solid var(--cc-border);
            border-radius:   12px;
            font-weight:     600;
            cursor:          pointer;
            text-decoration: none;
            display:         flex;
            align-items:     center;
            transition:      all 0.15s;
        }
        .btn-cancel:hover {
            border-color: var(--cc-navy);
            color:        var(--cc-navy);
        }
    </style>
</head>
<body>
<th:block th:replace="~{base :: layout(~{::content})}">
    <th:block th:fragment="content">

        <div class="container-fluid px-4">
            <div class="form-wrapper">

                <div class="page-header">
                    <h1>Edit Item</h1>
                    <p th:text="'Editing: ' + ${item.itemName}"></p>
                </div>

                <div class="form-card">
                    <div class="form-card-title">
                        <i class="bi bi-pencil-square"></i>
                        Update Item Details
                    </div>

                    <div id="formError"
                         class="alert alert-danger"
                         style="display:none"></div>
                    <div id="formSuccess"
                         class="alert alert-success"
                         style="display:none"></div>

                    <!-- Hidden item ID -->
                    <input type="hidden"
                           id="itemId"
                           th:value="${item.menuItemId}">

                    <div class="mb-3">
                        <label class="form-label">Item Name *</label>
                        <input type="text"
                               class="form-control"
                               id="itemName"
                               th:value="${item.itemName}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control"
                                  id="description"
                                  rows="3"
                                  th:text="${item.description}">
            </textarea>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Price (R) *</label>
                            <input type="number"
                                   class="form-control"
                                   id="price"
                                   step="0.50"
                                   th:value="${item.price}">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">Category *</label>
                            <select class="form-select"
                                    id="categoryId">
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.categoryId}"
                                        th:text="${cat.categoryName}"
                                        th:selected="${cat.categoryId
                                == item.categoryId}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="status">
                            <option value="Available"
                                    th:selected="${item.status
                            == 'Available'}">
                                Available
                            </option>
                            <option value="Low Stock"
                                    th:selected="${item.status
                            == 'Low Stock'}">
                                Low Stock
                            </option>
                            <option value="Sold Out"
                                    th:selected="${item.status
                            == 'Sold Out'}">
                                Sold Out
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="image">Item image</label>
                        <div class="mb-2" th:if="${item.imageUrl != null}">
                            <img th:src="${item.imageUrl}" alt="Current menu item"
                                 style="width: 120px; height: 90px; object-fit: cover; border-radius: 10px;">
                        </div>
                        <input class="form-control" type="file" id="image"
                               accept="image/png,image/jpeg,image/gif">
                        <small class="text-muted">Optional. Choose a new JPEG, PNG, or GIF (up to 5 MB) to replace it.</small>
                    </div>

                    <div class="form-actions">
                        <button class="btn-save"
                                onclick="updateItem()">
                            <i class="bi bi-check-lg me-1"></i>
                            Save Changes
                        </button>
                        <a href="/staff/menu" class="btn-cancel">
                            Cancel
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </th:block>
</th:block>

<script>
    // UPDATE — edit existing menu item
    // POST /api/staff/menu/{id}
    // DATABASE OPERATION: UPDATE (full)
    // Updates all editable fields in menu_items table
    function updateItem() {
        const itemId     = document.getElementById('itemId')
            .value;
        const itemName   = document.getElementById('itemName')
            .value.trim();
        const description = document.getElementById('description')
            .value.trim();
        const price      = document.getElementById('price').value;
        const categoryId = document.getElementById('categoryId')
            .value;
        const status     = document.getElementById('status').value;
        const csrfToken  = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        if (!itemName) {
            showError('Item name is required.');
            return;
        }
        if (!price || parseFloat(price) <= 0) {
            showError('Please enter a valid price.');
            return;
        }

        const btn = document.querySelector('.btn-save');
        btn.disabled    = true;
        btn.textContent = 'Saving...';

        const formData = new FormData();
        formData.append('itemName', itemName);
        formData.append('description', description);
        formData.append('price', price);
        formData.append('categoryId', categoryId);
        formData.append('status', status);
        const image = document.getElementById('image').files[0];
        if (image) formData.append('image', image);

        fetch(`/api/staff/menu/${itemId}`, {
            method:      'POST',
            credentials: 'same-origin',
            headers:     { [csrfHeader]: csrfToken },
            body:        formData
        })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('formSuccess')
                        .textContent   = 'Changes saved successfully!';
                    document.getElementById('formSuccess')
                        .style.display = 'block';
                    document.getElementById('formError')
                        .style.display = 'none';
                    setTimeout(() =>
                            window.location.href = '/staff/menu',
                        1200);
                } else {
                    showError(data.message);
                    btn.disabled    = false;
                    btn.textContent = 'Save Changes';
                }
            })
            .catch(() => {
                showError('Something went wrong.');
                btn.disabled    = false;
                btn.textContent = 'Save Changes';
            });
    }

    function showError(message) {
        const el = document.getElementById('formError');
        el.textContent   = message;
        el.style.display = 'block';
    }
</script>
</body>
</html>
