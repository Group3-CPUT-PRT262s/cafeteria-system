<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">

<head>


    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Forgot Password</title>

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">


</head>

<body>

<div class="auth-center-wrapper">


    <div class="visual-shape shape-1"></div>
    <div class="visual-shape shape-2"></div>
    <div class="visual-shape shape-3"></div>

    <div class="auth-center-card">

        <div class="auth-kicker">
            Password Recovery
        </div>

        <h1 class="auth-title">
            Forgot your password?
        </h1>

        <p class="auth-subtitle">
            Enter your email address, and we'll
            send you instructions to reset it.
        </p>

        <div th:if="${errorMessage}" class="auth-alert auth-alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="auth-alert auth-alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/forgot-password}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">

                <label for="email" class="form-label">
                    Email Address
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        required>

            </div>

            <button
                    type="submit"
                    class="auth-submit">

                Send Reset Link

            </button>

        </form>

        <div class="auth-footer">

            <a th:href="@{/login}"
               class="auth-link">

                Back to Sign In

            </a>

        </div>

    </div>


</div>

</body>
</html>
