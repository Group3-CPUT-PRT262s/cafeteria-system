<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Campus Cafeteria</title>
<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<main class="auth-center-wrapper">

<div class="visual-shape shape-1"></div>
<div class="visual-shape shape-2"></div>
<div class="visual-shape shape-3"></div>

<section class="auth-center-card" aria-labelledby="forgot-password-heading">

<header class="auth-header">
<p class="auth-kicker">Password Recovery</p>
<h1 id="forgot-password-heading" class="auth-title">Forgot your password?</h1>
<p class="auth-subtitle">
Enter the email address associated with your account and we'll send you instructions to reset your password.
</p>
</header>

<div
    th:if="${errorMessage}"
    class="auth-alert auth-alert-danger"
    role="alert"
    aria-live="polite"
    th:text="${errorMessage}">
</div>

<div
    th:if="${successMessage}"
    class="auth-alert auth-alert-success"
    role="status"
    aria-live="polite"
    th:text="${successMessage}">
</div>

<form
    id="forgotPasswordForm"
    th:action="@{/forgot-password}"
    method="post"
    novalidate>

<input
    type="hidden"
    th:name="${_csrf.parameterName}"
    th:value="${_csrf.token}" />

<div class="form-group">

<label
    for="email"
    class="form-label">
    Email Address
</label>

<input
    id="email"
    type="email"
    name="email"
    class="form-control"
    autocomplete="email"
    placeholder="Enter your email address"
    required>

<small class="form-feedback">
We'll send a secure password reset link to this email.
</small>

</div>

<button
    id="resetButton"
    type="submit"
    class="auth-submit">
    Send Reset Link
</button>

</form>

<footer class="auth-footer">

<p>
Remember your password?
<a
    th:href="@{/login}"
    class="auth-link">
    Back to Sign In
</a>
</p>

</footer>

</section>

</main>

<script>
const form = document.getElementById("forgotPasswordForm");
const button = document.getElementById("resetButton");

form.addEventListener("submit", function () {
    button.disabled = true;
    button.textContent = "Sending Reset Link...";
});
</script>

</body>
</html>
