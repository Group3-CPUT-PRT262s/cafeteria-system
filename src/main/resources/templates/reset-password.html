<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Campus Cafeteria</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-center-wrapper">

    <div class="visual-shape shape-1"></div>
    <div class="visual-shape shape-2"></div>
    <div class="visual-shape shape-3"></div>

    <div class="auth-center-card">

        <div class="auth-kicker">
            Reset Password
        </div>

        <h1 class="auth-title">
            Choose a new password
        </h1>

        <p class="auth-subtitle">
            Enter your new password below and submit to update it.
        </p>

        <div th:if="${errorMessage}" class="auth-alert auth-alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="auth-alert auth-alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="token" th:value="${token}">

            <div class="form-group">
                <label for="password" class="form-label">New Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
            </div>

            <button type="submit" class="auth-submit">Reset Password</button>
        </form>

        <div class="auth-footer">
            <a th:href="@{/login}" class="auth-link">Back to Sign In</a>
        </div>

    </div>

</div>

</body>
</html>
