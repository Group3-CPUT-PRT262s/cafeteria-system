<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Campus Cafeteria</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<main class="auth-center-wrapper">

    <div class="visual-shape shape-1"></div>
    <div class="visual-shape shape-2"></div>
    <div class="visual-shape shape-3"></div>

    <section class="auth-center-card" aria-labelledby="reset-password-heading">

        <header class="auth-header">
            <p class="auth-kicker">Secure Password Reset</p>
            <h1 id="reset-password-heading" class="auth-title">Choose a new password</h1>
            <p class="auth-subtitle">
                Create a strong password to secure your account. Once updated, you'll be able to sign in using your new credentials.
            </p>
        </header>

        <div th:if="${errorMessage}"
             class="auth-alert auth-alert-danger"
             role="alert"
             aria-live="polite"
             th:text="${errorMessage}">
        </div>

        <div th:if="${successMessage}"
             class="auth-alert auth-alert-success"
             role="status"
             aria-live="polite"
             th:text="${successMessage}">
        </div>

        <form id="resetPasswordForm"
              th:action="@{/reset-password}"
              method="post"
              novalidate>

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <input type="hidden"
                   name="token"
                   th:value="${token}" />

            <div class="form-group">

                <label for="password" class="form-label">New Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="password"
                        aria-label="Show password">

                        <svg width="20" height="20" viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>

                    </button>

                </div>

                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-fill"></div>
                    </div>
                    <div class="strength-text">Password strength</div>
                </div>

                <ul class="password-checklist">
                    <li>Minimum 8 characters</li>
                    <li>Uppercase letter</li>
                    <li>Lowercase letter</li>
                    <li>Number</li>
                    <li>Special character</li>
                </ul>

            </div>

            <div class="form-group">

                <label for="confirmPassword" class="form-label">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        class="form-control"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirmPassword"
                        aria-label="Show password">

                        <svg width="20" height="20" viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8S1 12 1 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>

                    </button>

                </div>

                <small id="passwordMatch" class="form-feedback"></small>

            </div>

            <button
                id="resetPasswordButton"
                type="submit"
                class="auth-submit">
                Reset Password
            </button>

        </form>

        <footer class="auth-footer">
            <a th:href="@{/login}" class="auth-link">
                Back to Sign In
            </a>
        </footer>

    </section>

</main>

<script>
document.querySelectorAll(".password-toggle").forEach(button=>{
    button.addEventListener("click",()=>{
        const input=document.getElementById(button.dataset.target);
        input.type=input.type==="password"?"text":"password";
    });
});

document.getElementById("resetPasswordForm").addEventListener("submit",()=>{
    const button=document.getElementById("resetPasswordButton");
    button.disabled=true;
    button.textContent="Updating Password...";
});
</script>

</body>
</html>
