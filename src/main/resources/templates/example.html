<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Campus Cafeteria</title>
<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<!--What Zee added-->
			<!--Filter bar-->
			<div class = "filter-bar">
				<div class = "filter-search">
					<i class = "bi bi-search"></i>
					<input type="text" id = "filterSearch" placeholder= "Search order/customer" oninput="applyFilters()" >
				</div>
				
				<select class  = "filter-select" id = "filterStatus" onchange = "applyFilters()">
				<option value = "active">Active orders</option>
				<option value = "all">All statuses</option>
				<option value = "Pending">Pending</option>
				<option value = "Confirmed">Confirmed</option>
				<option value = "Preparing">Preparing</option>
				<option value = "Ready">Ready</option>
				<option value = "Collected">Collected </option>
				</select>
				
				<select class = "filter-select" id = "filterSlot" onchange = "applyFilters
				<option value = "all">All time slots </option>
				</select>
				
				<button class = "filter-clear"onclick = "clearFilters()">
					<i class = "bi bi-x-lg me-1"></i>Clear
				</button>
				
				<span class = "filter-count" id = "filterCount"></span>
				
				</div>

               <script>
// <!--What Zee added-->
	// <!--Adding for the filter-->
	
	function populateSlotFilter(slots){
		const sel = document.getElementById('filterSlot');
		const prevValue = sel.value;
		sel.innerHTML = '<option value= "all">All time slots </option>';
		slots.forEach(slot => {
			const option = document.createElement('option');
			opt.value = slot.timeSlotId;
			opt.textContent = slot.slotTime;
			sel.appendChild(opt);
		});
	}
	
	function applyFilters(){
	
	if (!allOrders.length) return;
	
	const searchTerm = document.getElementById('filterSearch').value.trim().toLowerCase();
	const statusVal = document.getElementById('filterSlot').value;}
	
	const filtered = allOrders.filter( o => {
		if (statusVal == 'active' && o.orderStatus == 'Collected')
		return false;
		
		if (statusVal !== 'active' && statusVal !== 'all' && o.orderStatus !== statusVal)
		return false;
		
		if (slotVal !== 'all' && String (o.timeSlotId) !== slotVal)
		return false;
		
		if (searchTerm) {
			const matches = String(o.orderId).includes(searchTerm) || String(o.userId).includes(searchTerm);
			if (!matches) 
			return false;
		}
		return true;
	});
	
	document.getElementById('filterCount').textContent = 'Showing ${filtered.length} of ${allOrders.length} orders';
	
	if (filtered.length === 0){
		document.getElementById('dashContent').innerHtML = '';
		document.getElementById('dashContent').style.display = 'block';
		}else{
			document.getElementById('dashNoResults').style.display ='none';
			document.getElementById('dashContent').style.display = 'block';
			renderDashboard(filtered,timeSlots)	
	}
	
	function clearFilters(){
		document.getElementById('filterSearch').value = '';
		document.getElementById('filterStatus').value = 'active';
		document.getElementById('filterSlot').value = 'all';
		applyFilters();
		
	}

    </script>
    </body>
</html>
