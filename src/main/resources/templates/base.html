<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary" sec:authorize="isAuthenticated()">
        <div class="container">
            <a class="navbar-brand" href="#">Cafeteria System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <!-- Menu (accessible by both students and staff) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('STUDENT', 'STAFF', 'ADMIN')">
                        <a class="nav-link" href="/customer/menu">Menu</a>
                    </li>

                    <!-- Student Navigation -->
                    <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                        <a class="nav-link" href="/customer/history">Order History</a>
                    </li>

                    <!-- Staff Navigation -->
                    <li class="nav-item" sec:authorize="hasAnyRole('STAFF', 'ADMIN')">
                        <a class="nav-link" href="/staff/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('STAFF', 'ADMIN')">
                        <a class="nav-link" href="/staff/menu-management">Menu Management</a>
                    </li>
                </ul>

                <!-- User Info and Logout -->
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                           data-bs-toggle="dropdown">
                            <span sec:authentication="name"></span>
                            (<span sec:authentication="principal.authorities[0].authority"></span>)
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/logout">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-4">
        <div th:replace="${content ?: 'No content defined'}"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-light text-center text-muted mt-5 py-3" sec:authorize="isAuthenticated()">
        <div class="container">
            <p>&copy; 2024 University Cafeteria System</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
