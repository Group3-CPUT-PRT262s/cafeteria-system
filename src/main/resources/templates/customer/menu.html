<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Cafeteria Menu</h2>
            <p class="text-muted">Choose your items and select a pickup time.</p>
        </div>
        <div>
            <a class="btn btn-secondary" href="/customer/history">Order History</a>
            <a class="btn btn-outline-danger" href="/logout">Logout</a>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form th:action="@{/customer/order}" method="post">
        <div class="mb-3">
            <label for="timeSlotId" class="form-label">Pickup Time Slot</label>
            <select class="form-select" id="timeSlotId" name="timeSlotId" required>
                <option value="" disabled selected>Select pickup time</option>
                <option th:each="slot : ${timeSlots}"
                        th:value="${slot.id}"
                        th:text="${slot.slotTime}">
                </option>
            </select>
        </div>

        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>Item</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Price</th>
                    <th>Quantity</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${menuItems}">
                    <td th:text="${item.itemName}"></td>
                    <td th:text="${item.description}"></td>
                    <td>
                        <span th:text="${item.status}" 
                              th:classappend="${item.status == 'Available' ? 'badge bg-success' : (item.status == 'Low Stock' ? 'badge bg-warning' : 'badge bg-danger')}"></span>
                    </td>
                    <td th:text="'₦' + ${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td>
                        <input class="form-control" type="number" min="0" name="quantity_${item.id}" value="0" />
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">Place Order</button>
        </div>
    </form>
</div>
</body>
</html>
