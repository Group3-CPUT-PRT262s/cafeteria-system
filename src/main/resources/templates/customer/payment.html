<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{base :: head}"></th:block>
    <title th:text="${pageTitle ?: 'Payment'}">Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../static/css/app.css"/>
</head>
<body>
<th:block th:replace="~{base :: layout(~{::content})}">
    <th:block th:fragment="content">

    <!-- Main Content Area -->
    <main class="cc-main">
        <div class="container confirmation-shell">
            
            <div class="page-header text-center">
                <h1>Payment</h1>
            </div>

            <div class="cc-card mx-auto mt-4 text-center py-4" style="max-width: 450px;">
                
                <form th:action="@{/order-detail}" method="POST">
                    
                    <div class="mb-4 p-4 border rounded bg-light mx-auto" style="width: 80%;">
                        <p class="text-muted small mb-3 fw-bold">Select Payment Method</p>
                  
                        <div class="d-flex justify-content-center gap-3">
                            
                            <input type="radio" class="btn-check" name="paymentMethod" id="payCard" value="CARD" required>
                            <label class="btn btn-outline-secondary d-flex align-items-center justify-content-center shadow-sm" for="payCard" style="width: 60px; height: 45px; font-size: 1.5rem;">
                                💳
                            </label>

                            <input type="radio" class="btn-check" name="paymentMethod" id="payMobile" value="SNAPSCAN">
                            <label class="btn btn-outline-secondary d-flex align-items-center justify-content-center shadow-sm" for="payMobile" style="width: 60px; height: 45px; font-size: 1.5rem;">
                                📱
                            </label>

                            <input type="radio" class="btn-check" name="paymentMethod" id="payBank" value="EFT">
                            <label class="btn btn-outline-secondary d-flex align-items-center justify-content-center shadow-sm" for="payBank" style="width: 60px; height: 45px; font-size: 1.5rem;">
                                🏦
                            </label>
                            
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary py-2 mt-2 w-75 rounded-pill fw-bold">Confirm Payment</button>
                    
                </form>
            </div>

        </div>
    </main>
    
    </th:block>
</th:block>

</body>
</html>
