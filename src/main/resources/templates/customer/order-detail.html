<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{base :: head}"></th:block><link rel="stylesheet" th:href="@{/css/customer.css}"><title th:text="${pageTitle}">Order details</title></head><body><th:block th:replace="~{base :: layout(~{::content})}"><th:block th:fragment="content"><section class="customer-page"><div class="checkout-layout"><div><div class="customer-kicker text-dark">Order details</div><h1 th:text="'Order #' + ${order.orderId}"></h1></div><span class="status-pill" th:classappend="${order.orderStatus}" th:text="${order.orderStatus}"></span></div><div class="checkout-grid"><section class="customer-card"><h2>Your items</h2><div class="order-line" th:each="line : ${orderLines}"><span><strong th:text="${line.quantity} + ' × ' + ${line.itemName}"></strong></span><strong th:text="'R' + ${#numbers.formatDecimal(line.subtotal,1,'COMMA',2,'POINT')}"></strong></div><div class="summary-total"><span>Total</span><span th:text="'R' + ${#numbers.formatDecimal(order.totalAmount,1,'COMMA',2,'POINT')}"></span></div></section><aside class="customer-card"><h2>Pickup information</h2><p class="text-muted mb-1">Pickup slot ID</p><strong th:text="${order.timeSlotId}"></strong><p class="text-muted mt-4 mb-1">Placed</p><strong th:text="${#temporals.format(order.orderedAt,'dd MMM yyyy, HH:mm')}"></strong><p class="small text-muted mt-4">Show your order number at collection.</p><a class="btn btn-outline-secondary w-100" th:href="@{/customer/history}">Back to orders</a></aside></div></section></th:block></th:block></body></html>
