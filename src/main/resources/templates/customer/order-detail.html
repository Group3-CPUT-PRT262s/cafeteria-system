<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{base :: head}"></th:block>
    <title th:text="${pageTitle ?: 'Order Received'}">Order Received</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../static/css/app.css"/>
</head>
<body>
<th:block th:replace="~{base :: layout(~{::content})}">
    <th:block th:fragment="content">

        <main class="cc-main">
            <div class="container confirmation-shell">
                
                <div class="page-header text-center mb-3">
                    <h1>Order Received</h1>
                </div>

                
                <div class="alert alert-success mx-auto text-center fw-bold mb-4 shadow-sm" style="max-width: 450px;" role="alert">
                    Order placed successfully
                </div>

                
                <div class="cc-card mx-auto p-4" style="max-width: 450px;">
                    <h5 class="mb-4 text-center fw-bold" style="color: var(--cc-navy);">Order Summary</h5>

                    <div class="d-flex flex-column gap-2 mb-3 border-bottom pb-3">
                        
                        <div th:each="item : ${orderItems}" class="d-flex justify-content-between align-items-center text-muted small">
                            
                            <!-- Loop through the orderItems list -->
                            <span>
                                <span th:text="${item.quantity}">1</span>x 
                                <span th:text="${item.itemName}">Burger</span>
                            </span> 
                            <span class="fw-bold" style="color: var(--cc-text);" th:text="'R' + ${item.subtotal}">R50.00</span>
                            
                        </div>
                        
                        <div th:if="${order == null}" class="d-flex justify-content-between align-items-center text-muted small">
                            <span>1x Redbull</span>
                            <span class="fw-bold" style="color: var(--cc-text);">R20</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4 fw-bold">
                        <span>Total Price</span>
                        <span th:text="'R' + ${order.totalAmount ?: '45'}">R45</span>
                    </div>

                    <div class="bg-light rounded p-3 text-center mb-4 border">
                        <div class="mb-1 fw-bold" style="color: var(--cc-navy);">
                            Order No: <span th:text="${order.orderId ?: '#A-992'}">#A-992</span>
                        </div>
                        <div class="mb-1 text-muted small">
                            Total Paid: <span th:text="'R' + ${order.totalAmount ?: '45.00'}">R45.00</span>
                        </div>
                        <div class="fw-bold mt-2 pt-2 border-top" style="color: var(--cc-accent);">
                            Collect At Window: <span th:text="${order.timeSlotId ?: '13:30 - 14:00'}">13:30 - 14:00</span>
                        </div>
                    </div>

                    <div class="d-grid mt-2">
                        <a th:href="@{/menu}" class="btn btn-cc-primary py-2 rounded-pill">New Order</a>
                    </div>
                </div>

            </div>
        </main>

    </th:block>
</th:block>

</body>
</html>
