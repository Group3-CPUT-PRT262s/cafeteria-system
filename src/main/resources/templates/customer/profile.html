<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{base :: head}"></th:block><link rel="stylesheet" th:href="@{/css/customer.css}"><title th:text="${pageTitle}">My Profile</title></head><body><th:block th:replace="~{base :: layout(~{::content})}"><th:block th:fragment="content"><section class="customer-page"><div class="customer-kicker text-dark">Account</div><h1>My profile</h1><div class="customer-card" style="max-width:680px"><form th:action="@{/profile}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="row g-3"><div class="col-md-6"><label class="form-label">First name</label><input class="form-control" name="firstName" th:value="${user.firstName}"></div><div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" name="lastName" th:value="${user.lastName}"></div><div class="col-12"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required th:value="${user.email}"></div><div class="col-12"><label class="form-label">Username</label><input class="form-control" disabled th:value="${user.username}"><div class="form-text">Your username and role are managed separately.</div></div></div><button class="btn btn-success mt-4">Save changes</button></form></div></section></th:block></th:block></body></html>
