<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{base :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/customer.css}">
    <title th:text="${pageTitle}">Checkout</title>
</head>

<body>
    <th:block th:replace="~{base :: layout(~{::content})}">
        <th:block th:fragment="content">
            <section class="customer-page">
                <div class="customer-kicker text-dark">Checkout</div>
                <h1>Choose your pickup and payment method</h1>
                <p class="text-muted">Your order and selected payment method will be saved to the database. No external
                    payment is taken in this demo.</p>
                <form th:action="@{/checkout}" method="post" class="checkout-grid"><input type="hidden"
                        th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <section class="customer-card">
                        <h2>1. Pickup time</h2><label class="choice" th:each="slot : ${timeSlots}"><input type="radio"
                                name="timeSlotId" th:value="${slot.timeSlotId}" required><strong class="ms-2"
                                th:text="${slot.slotTime}"></strong><span class="float-end text-muted small"
                                th:text="${slot.maxOrders} + ' orders max'"></span></label>
                        <p class="text-muted small" th:if="${#lists.isEmpty(timeSlots)}">No pickup slots are available
                            right now.</p>
                        <h2 class="mt-4">2. Payment method</h2><label class="choice"><input type="radio"
                                name="paymentMethod" value="CARD" required><strong class="ms-2">Card</strong><span
                                class="float-end text-muted small">Recorded as demo payment</span></label><label
                            class="choice"><input type="radio" name="paymentMethod" value="SNAPSCAN"><strong
                                class="ms-2">SnapScan</strong></label><label class="choice"><input type="radio"
                                name="paymentMethod" value="EFT"><strong class="ms-2">EFT</strong></label>
                    </section>
                    <aside class="customer-card">
                        <h2>Order summary</h2>
                        <div id="checkoutLines"></div>
                        <div class="summary-total"><span>Total</span><span id="checkoutTotal">R0.00</span></div><button
                            class="btn btn-success w-100 mt-3">Place order</button><a class="btn btn-link w-100"
                            th:href="@{/cart}">Back to cart</a>
                    </aside>
                </form>
            </section>
        </th:block>
    </th:block>
    <script>
    async function load() { const d = await (await fetch('/api/cart')).json(); document.querySelector('#checkoutLines').innerHTML = d.items.map(i => `<div class="order-line"><span>${i.quantity} × ${i.itemName}</span><strong>R${Number(i.subtotal).toFixed(2)}</strong></div>`).join(''); document.querySelector('#checkoutTotal').textContent = 'R' + Number(d.totalPrice).toFixed(2) } load();</script>
</body>

</html>
