<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{base :: head}"></th:block>
    <title th:text="${pageTitle}">My Orders | Campus Cafeteria</title>
    <!-- page styles go here -->
    <style>
        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f8fbff 0%,
                    #eef7ff 100%
                );

            color: #102027;
        }


        /* =========================
           PAGE
           ========================= */

        .orders-page {

            min-height: 100vh;

            padding:
                65px
                20px
                60px;
        }


        .orders-container {

            width: 850px;

            max-width: 100%;

            margin: 0 auto;
        }


        /* =========================
           HEADER
           ========================= */

        .orders-header {

            text-align: center;

            margin-bottom: 35px;
        }


        .orders-icon {

            width: 58px;
            height: 58px;

            margin:
                0 auto
                12px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #dff2ff;

            border-radius: 50%;

            font-size: 27px;
        }


        .orders-title {

            margin: 0;

            font-size: 50px;

            font-weight: 700;

            letter-spacing: -1.5px;
        }


        .orders-subtitle {

            margin-top: 8px;

            color: #718087;

            font-size: 15px;
        }


        /* =========================
           SEARCH
           ========================= */

        .search-box {

            position: relative;

            margin-bottom: 25px;
        }


        .search-box input {

            width: 100%;

            height: 48px;

            padding:
                0 18px
                0 48px;

            border:
                1px solid #dce8ef;

            border-radius: 14px;

            outline: none;

            background: white;

            font-size: 14px;

            box-shadow:
                0 4px 12px
                rgba(35, 78, 104, 0.06);
        }


        .search-box input:focus {

            border-color: #63baf0;

            box-shadow:
                0 0 0 3px
                rgba(99, 186, 240, 0.15);
        }


        .search-icon {

            position: absolute;

            left: 18px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 18px;

            color: #7d8c92;
        }


        /* =========================
           ORDER CARD
           ========================= */

        .order-card {

            background: white;

            border-radius: 20px;

            padding: 22px 24px;

            margin-bottom: 16px;

            border:
                1px solid #e7f0f5;

            box-shadow:
                0 8px 24px
                rgba(35, 78, 104, 0.09);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .order-card:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 28px
                rgba(35, 78, 104, 0.13);
        }


        .order-top {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 16px;
        }


        .order-number {

            font-size: 19px;

            font-weight: 700;

            color: #102027;
        }


        .order-date {

            margin-top: 5px;

            color: #7b898f;

            font-size: 13px;
        }


        /* =========================
           STATUS
           ========================= */

        .status {

            padding:
                7px
                13px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;
        }


        .status-pending {

            background: #fff4d6;

            color: #996c00;
        }


        .status-ready {

            background: #e2f7ec;

            color: #18794e;
        }


        .status-collected {

            background: #e4f2ff;

            color: #1769aa;
        }


        .status-default {

            background: #edf0f2;

            color: #58666c;
        }


        /* =========================
           ORDER INFORMATION
           ========================= */

        .order-info {

            display: grid;

            grid-template-columns:
                1fr
                1fr
                auto;

            align-items: center;

            gap: 20px;

            padding-top: 15px;

            border-top:
                1px solid #edf1f4;
        }


        .info-label {

            font-size: 12px;

            color: #8a979c;

            margin-bottom: 4px;
        }


        .info-value {

            font-size: 16px;

            font-weight: 700;

            color: #24373e;
        }


        .price {

            color: #0879c9;

            font-size: 19px;
        }


        /* =========================
           VIEW BUTTON
           ========================= */

        .view-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            min-width: 120px;

            height: 42px;

            padding:
                0 18px;

            border: none;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #69c5f5,
                    #42aee9
                );

            color: #06202c;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            box-shadow:
                0 5px 12px
                rgba(66, 174, 233, 0.22);

            transition: 0.2s ease;
        }


        .view-button:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 7px 16px
                rgba(66, 174, 233, 0.30);
        }


        /* =========================
           EMPTY ORDERS
           ========================= */

        .empty-orders {

            background: white;

            border-radius: 22px;

            padding:
                55px
                25px;

            text-align: center;

            border:
                1px solid #e7f0f5;

            box-shadow:
                0 8px 24px
                rgba(35, 78, 104, 0.08);
        }


        .empty-icon {

            width: 65px;

            height: 65px;

            margin:
                0 auto
                15px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #eaf6ff;

            border-radius: 50%;

            font-size: 28px;
        }


        .empty-orders h2 {

            margin:
                5px
                0
                8px;

            font-size: 22px;
        }


        .empty-orders p {

            margin: 0 0 20px;

            color: #7b898f;

            font-size: 14px;
        }


        .menu-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            height: 44px;

            padding:
                0 22px;

            border-radius: 22px;

            background: #0879c9;

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;
        }


        .menu-button:hover {

            background: #0668ad;
        }


        /* =========================
           SUCCESS MESSAGE
           ========================= */

        .success-message {

            background: #e8f8ef;

            color: #18794e;

            border:
                1px solid #ccebd9;

            border-radius: 12px;

            padding:
                12px
                16px;

            margin-bottom: 20px;

            font-size: 14px;

            font-weight: 600;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 650px) {

            .orders-page {

                padding-top: 45px;
            }


            .orders-title {

                font-size: 40px;
            }


            .order-top {

                align-items: flex-start;

                gap: 15px;
            }


            .order-info {

                grid-template-columns:
                    1fr
                    1fr;
            }


            .view-button {

                width: 100%;
            }

        }
    </style>
</head>
<body>
<th:block th:replace="~{base :: layout(~{::content})}">
    <th:block th:fragment="content">

    <div class="orders-page">

        <div class="orders-container">
    
    
            <!-- =========================
                 HEADER
                 ========================= -->
    
            <div class="orders-header">
    
                <div class="orders-icon">
                    
                </div>
    
                <h1 class="orders-title">
                    My Orders
                </h1>
    
                <p class="orders-subtitle">
                    View your orders and track their progress
                </p>
    
            </div>
    
    
            <!-- =========================
                 SUCCESS MESSAGE
                 ========================= -->
    
            <div
                th:if="${success}"
                class="success-message">
    
                ✓
                <span th:text="${success}">
                    Order placed successfully.
                </span>
    
            </div>
    
    
            <!-- =========================
                 SEARCH
                 ========================= -->
    
            <div class="search-box">
    
                <span class="search-icon">
                    
                </span>
    
                <input
                    type="text"
                    id="orderSearch"
                    placeholder="Search your orders..."
                    onkeyup="searchOrders()">
    
            </div>
    
    
            <!-- =========================
                 NO ORDERS
                 ========================= -->
    
            <div
                th:if="${#lists.isEmpty(orders)}"
                class="empty-orders">
    
                <div class="empty-icon">
                    
                </div>
    
                <h2>
                    No orders yet
                </h2>
    
                <p>
                    Your cafeteria orders will appear here.
                </p>
    
                <a
                    th:href="@{/menu}"
                    class="menu-button">
    
                    Browse Menu →
    
                </a>
    
            </div>
    
    
            <!-- =========================
                 ORDER LIST
                 ========================= -->
    
            <div
                id="ordersList"
                th:unless="${#lists.isEmpty(orders)}">
    
    
                <div
                    class="order-card"
                    th:each="order : ${orders}"
                    th:attr="data-order-id=${order.orderId}">
    
    
                    <!-- TOP -->
    
                    <div class="order-top">
    
    
                        <div>
    
                            <div class="order-number">
    
                                Order #
    
                                <span
                                    th:text="${order.orderId}">
                                    1001
                                </span>
    
                            </div>
    
    
                            <div class="order-date">
    
                                <span
                                    th:text="${#temporals.format(order.orderedAt, 'dd MMM yyyy, HH:mm')}">
    
                                    27 September 2026, 12:30
    
                                </span>
    
                            </div>
    
                        </div>
    
    
                        <!-- STATUS -->
    
                        <span
                            class="status"
                            th:classappend="${order.orderStatus == 'Pending'}
                                ? ' status-pending'
                                : (${order.orderStatus == 'Ready'}
                                ? ' status-ready'
                                : (${order.orderStatus == 'Collected'}
                                ? ' status-collected'
                                : ' status-default'))"
                            th:text="${order.orderStatus}">
    
                            Pending
    
                        </span>
    
    
                    </div>
    
    
                    <!-- INFORMATION -->
    
                    <div class="order-info">
    
    
                        <div>
    
                            <div class="info-label">
                                Order Total
                            </div>
    
                            <div
                                class="info-value price">
    
                                R<span
                                    th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">
    
                                    0.00
    
                                </span>
    
                            </div>
    
                        </div>
    
    
                        <div>
    
                            <div class="info-label">
                                Order Status
                            </div>
    
                            <div
                                class="info-value"
                                th:text="${order.orderStatus}">
    
                                Pending
    
                            </div>
    
                        </div>
    
    
                        <div>
    
                            <a
                                th:href="@{/orders/{id}(id=${order.orderId})}"
                                class="view-button">
    
                                View Details
                                →
    
                            </a>
    
                        </div>
    
    
                    </div>
    
    
                </div>
    
    
            </div>
    
    
        </div>
    
    </div>

    </th:block>
</th:block>
<!-- page scripts go here -->
<script>
    
    /* =========================
       SEARCH ORDERS
       ========================= */

    function searchOrders() {

        const search =
            document
                .getElementById(
                    "orderSearch"
                )
                .value
                .toLowerCase();


        const orders =
            document.querySelectorAll(
                ".order-card"
            );


        orders.forEach(
            function (order) {

                const orderId =
                    order
                        .getAttribute(
                            "data-order-id"
                        )
                        .toLowerCase();


                if (
                    orderId.includes(search)
                ) {

                    order.style.display =
                        "";

                } else {

                    order.style.display =
                        "none";

                }

            }
        );

    }
</script>
</body>
</html>
