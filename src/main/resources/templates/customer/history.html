<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
    <th:block th:replace="~{base :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/customer.css}">
    <title>Order history</title></head><body><th:block th:replace="~{base :: layout(~{::content})}"><th:block th:fragment="content"><section class="customer-page"><div class="checkout-layout"><div><div class="customer-kicker text-dark">Your orders</div><h1 class="mb-0">Order history</h1></div><a class="btn btn-success" th:href="@{/menu}">Start a new order</a></div><div class="customer-card" th:if="${!#lists.isEmpty(orders)}"><div class="cart-line" th:each="order : ${orders}"><div><strong th:text="'Order #' + ${order.orderId}"></strong><div class="text-muted small" th:text="${#temporals.format(order.orderedAt,'dd MMM yyyy, HH:mm')}"></div></div><div class="text-end"><span class="status-pill" th:classappend="${order.orderStatus}" th:text="${order.orderStatus}"></span><strong class="d-block mt-2" th:text="'R' + ${#numbers.formatDecimal(order.totalAmount,1,'COMMA',2,'POINT')}"></strong><a class="small" th:href="@{/orders/{id}(id=${order.orderId})}">View details</a></div></div></div><div class="customer-card empty-state" th:if="${#lists.isEmpty(orders)}">You have not placed an order yet.<br><a class="btn btn-success mt-3" th:href="@{/menu}">Browse the menu</a></div></section></th:block></th:block></body></html>
