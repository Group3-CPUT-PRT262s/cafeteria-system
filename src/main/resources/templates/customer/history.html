<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Order History</h2>
            <p class="text-muted">Review your past cafeteria orders.</p>
        </div>
        <div>
            <a class="btn btn-secondary" href="/customer/menu">Back to Menu</a>
            <a class="btn btn-outline-danger" href="/logout">Logout</a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div th:if="${orders.empty}" class="alert alert-info">
        No orders found. Place your first order from the menu.
    </div>

    <div th:if="${!orders.empty}" class="accordion" id="historyAccordion">
        <div class="accordion-item" th:each="order, orderStat : ${orders}">
            <h2 class="accordion-header" th:attr="id=${'heading' + orderStat.index}">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        th:attr="data-bs-target=${'#collapse' + orderStat.index}" aria-expanded="false"
                        th:attrappend="aria-controls=${'collapse' + orderStat.index}">
                    Order #<span th:text="${order.id}"></span> —
                    <span th:text="${order.status}"></span>
                    <small class="text-muted ms-3" th:text="'Total: ₦' + ${#numbers.formatDecimal(order.totalPrice, 1, 'COMMA', 2, 'POINT')}"></small>
                </button>
            </h2>
            <div th:attr="id=${'collapse' + orderStat.index}" class="accordion-collapse collapse"
                 th:attrappend="aria-labelledby=${'heading' + orderStat.index}" data-bs-parent="#historyAccordion">
                <div class="accordion-body">
                    <p><strong>Ordered at:</strong> <span th:text="${order.orderTime}"></span></p>
                    <p><strong>Pickup slot:</strong>
                        <span th:text="${order.pickupTimeSlot.startTime} + ' - ' + ${order.pickupTimeSlot.endTime}"></span>
                    </p>
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                            <tr>
                                <th>Item</th>
                                <th>Quantity</th>
                                <th>Unit Price</th>
                                <th>Line Total</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${order.orderItems}">
                                <td th:text="${item.menuItem.name}"></td>
                                <td th:text="${item.quantity}"></td>
                                <td th:text="${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}"></td>
                                <td th:text="${#numbers.formatDecimal(item.price * item.quantity, 1, 'COMMA', 2, 'POINT')}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
