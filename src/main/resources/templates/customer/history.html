<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Order History</h2>
            <p class="text-muted">Review your past cafeteria orders.</p>
        </div>
        <div>
            <a class="btn btn-secondary" href="/customer/menu">Back to Menu</a>
            <a class="btn btn-outline-danger" href="/logout">Logout</a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>



    <div th:if="${!orders.empty}" class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Order ID</th>
                <th>Status</th>
                <th>Total Amount</th>
                <th>Ordered At</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="'#' + ${order.id}"></td>
                <td>
                    <span th:text="${order.orderStatus}" 
                          th:classappend="${order.orderStatus == 'Pending' ? 'badge bg-warning' : (order.orderStatus == 'Ready' ? 'badge bg-info' : 'badge bg-success')}"></span>
                </td>
                <td th:text="'₦' + ${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${#temporals.format(order.orderedAt, 'dd MMM yyyy HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    
    <div th:if="${orders.empty}" class="alert alert-info mt-4">
        <p class="mb-0">No orders found. Place your first order from the <a th:href="@{/customer/menu}">menu</a>.</p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
