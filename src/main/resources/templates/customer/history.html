<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4 history-shell">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <div class="eyebrow"><i class="bi bi-clock-history"></i> Your orders</div>
            <h2 class="mb-1">Order History</h2>
            <p class="text-muted mb-0">Review your recent campus orders and pickups.</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-cc-outline" th:href="@{/menu}">Back to Menu</a>
            <a class="btn btn-outline-danger" th:href="@{/logout}">Logout</a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div th:if="${!orders.empty}" class="table-responsive cc-card p-3">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>Order ID</th>
                <th>Status</th>
                <th>Total Amount</th>
                <th>Ordered At</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="'#' + ${order.id}"></td>
                <td>
                    <span th:text="${order.orderStatus}"
                          th:classappend="${order.orderStatus == 'Pending' ? 'badge bg-warning' : (order.orderStatus == 'Ready' ? 'badge bg-info' : 'badge bg-success')}"></span>
                </td>
                <td th:text="'R' + ${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${#temporals.format(order.orderedAt, 'dd MMM yyyy HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${orders.empty}" class="alert alert-info mt-4">
        <p class="mb-0">No orders found. Place your first order from the <a th:href="@{/menu}">menu</a>.</p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
