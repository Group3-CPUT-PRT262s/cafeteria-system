# ── Application ───────────────────────────────
spring.application.name=cafeteria-system

# ── PostgreSQL Database ───────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/cafeteria_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ── Email (Mailpit SMTP) ──────────────────────
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:no-reply@cafeteria.local}

# ── JPA / Hibernate ───────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Thymeleaf ─────────────────────────────────
spring.thymeleaf.cache=false

# ── Server ────────────────────────────────────
server.port=8080

# ── User-uploaded images ──────────────────────
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB