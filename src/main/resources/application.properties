# ── Application ───────────────────────────────
spring.application.name=cafeteria-system

# ── PostgreSQL Database ───────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/cafeteria_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ── Mail (Gmail SMTP) ─────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME} # please for the love of god, dont hardcode these credentals. Save them in env vars(dont forget to add them to .gitignore so they dont get pushed to github)
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# ── JPA / Hibernate ───────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Thymeleaf ─────────────────────────────────
spring.thymeleaf.cache=false

# ── Server ────────────────────────────────────
server.port=8080